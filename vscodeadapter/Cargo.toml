[package]
name = "vscodeadapter"
version = "0.1.0"
authors = ["Kristof Rabel ", "Bence Marcell Egi-Matus", "Szabolcs Gombos"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
commit_checker_core = { path = "../core" }
serde = { version = "1", features = ["derive"]}
serde_json ="1.0.149"
"commit_checker_message_handler" = { path = "../message_handler" }