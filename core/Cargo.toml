[package]
name = "commit_checker_core"
version = "0.1.0"
authors = ["Kristof Rabel ", "Bence Marcell Egi-Matus", "Szabolcs Gombos"]
edition = "2024"

[dependencies]
"commit_checker_message_handler" = { path = "../message_handler" }
oxc = { version = "0.102.0", features = ["semantic"] }
oxc_semantic = { version = "0.102.0", features = ["linter"] }
line-numbers = "0.4.0"

[dev-dependencies]
"commit_checker_message_handler" = { path = "../message_handler", features = ["testmode"]}